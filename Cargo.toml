[workspace]
resolver = "2"
members = [
    "litert-sys",
    "litert",
    "litert-lm-sys",
    "litert-lm",  # directory name kept; crate name is "litertlm"
    "xtask",
]

[workspace.package]
version       = "0.3.0"
edition       = "2024"
rust-version  = "1.88"
license       = "Apache-2.0"
repository    = "https://github.com/offbit-ai/LiteRT"
homepage      = "https://github.com/offbit-ai/LiteRT"
documentation = "https://docs.rs/litert"
authors       = ["LiteRT-rs Contributors"]
readme        = "README.md"
keywords      = ["litert", "tflite", "tensorflow", "ml", "inference"]
categories    = ["api-bindings", "science"]

[workspace.dependencies]
litert-sys    = { version = "0.3.0", path = "litert-sys" }
litert        = { version = "0.3.0", path = "litert" }
litert-lm-sys = { version = "0.3.0", path = "litert-lm-sys" }
litertlm      = { version = "0.3.0", path = "litert-lm" }

thiserror   = "2.0.20"
libloading  = "0.9"

# Build-time deps shared by -sys crates. ureq uses pure-Rust rustls so the
# build doesn't need libssl-dev (important for cross containers).
ureq       = { version = "2", default-features = false, features = ["tls"] }
sha2       = "0.11"
zip        = { version = "8", default-features = false, features = ["deflate"] }
tar        = "0.4"
flate2     = "1"
dirs       = "6"
bindgen    = "0.69"
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
